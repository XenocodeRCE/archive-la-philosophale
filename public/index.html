<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Philosophale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <nav id="servers" aria-label="Serveurs">
      <div class="server-icon" title="La Philosophale">Φ</div>
    </nav>

    <aside id="sidebar">
      <header id="server-header">
        <span>La Philosophale</span>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </header>
      <div id="channel-list"></div>
      <footer id="user-panel">
        <div class="avatar" style="background:#4e5058">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="user-text">
          <div class="user-name">Lecture seule</div>
          <div class="user-status">Archive du serveur</div>
        </div>
      </footer>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="topbar-left"></div>
        <div id="topbar-right">
          <button id="btn-members" class="icon-btn" title="Afficher/masquer les participants" aria-label="Participants">
            <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.4c2 .8 3.5 2.6 3.5 5.6"/></svg>
          </button>
          <div class="search">
            <input id="search-input" type="text" placeholder="Rechercher" autocomplete="off" spellcheck="false">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
          </div>
        </div>
      </header>

      <div id="content-row">
        <section id="chat">
          <div id="scroller">
            <div id="intro" hidden></div>
            <div id="messages"></div>
          </div>
          <div id="jump-bar" hidden>
            <span>Vous consultez d’anciens messages</span>
            <button id="btn-jump" type="button">Aller au présent</button>
          </div>
          <div id="composer">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <span>Vous n’avez pas la permission d’envoyer des messages dans ce salon.</span>
          </div>
        </section>

        <aside id="members"></aside>
        <aside id="search-panel" hidden></aside>
      </div>
    </main>
  </div>

  <div id="lightbox" hidden><img alt=""></div>
  <script src="app.js"></script>
</body>
</html>
